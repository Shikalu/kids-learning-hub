<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Kids Learning Hub 儿童跨学科学习探索平台，通过阅读、地理、数学等互动专题，陪伴孩子探索与发现。" />
<title>Kids Learning Hub · 儿童跨学科学习探索平台</title>
<style>
:root{--ink:#202124;--muted:#70757b;--line:#e8e8e6;--paper:#fff;--blue:#245b86}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);line-height:1.55}
a{color:inherit}
.site-header{max-width:1440px;margin:0 auto;padding:52px 24px 34px;text-align:center;border-bottom:1px solid var(--line)}
h1{font-size:clamp(32px,4vw,44px);line-height:1.2;letter-spacing:-.025em;margin:0 0 12px}
.tagline{font-size:clamp(19px,2.2vw,25px);color:#777;margin:0}
.subtitle{font-size:clamp(18px,2vw,23px);color:#777;margin:4px 0 0}
main{max-width:1440px;margin:0 auto;padding:48px 24px 64px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 20px}
.card{min-width:0;margin:0}
a.card{display:block;text-decoration:none;border-radius:20px}
a.card:focus-visible{outline:3px solid #245b8666;outline-offset:6px}
.card-art{aspect-ratio:16/9;overflow:hidden;border:1px solid #eceae4;border-radius:20px;background:#f6f4ef}
.card-art svg{display:block;width:100%;height:100%;transition:transform .2s}
a.card:hover .card-art svg{transform:scale(1.012)}
a.card:hover h2{color:var(--blue)}
.card h2{font-size:clamp(22px,2.4vw,30px);line-height:1.3;margin:16px 0 5px;transition:color .15s}
.card p{font-size:clamp(16px,1.7vw,20px);color:var(--muted);margin:0}
.card .status{font-size:15px;color:#85898d;margin-top:3px}
.card .path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
@media(max-width:700px){.site-header{padding:36px 18px 26px}main{padding:28px 16px 44px}.topics{grid-template-columns:1fr;gap:30px}.card-art{border-radius:15px}.card h2{margin-top:12px}}
@media(prefers-reduced-motion:reduce){.card-art svg{transition:none}a.card:hover .card-art svg{transform:none}}
</style>
</head>
